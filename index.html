<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application Management System</title>
<script src="xlsx.full.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';document.head.appendChild(s)"></script>
<style>
:root{--navy:#14304f;--teal:#0f766e;--bg:#eef2f6;--card:#fff;--line:#d9e1ea;--txt:#1b2733;--mut:#64748b;--green:#15803d;--red:#dc2626;--blk:#1f2937}
*{box-sizing:border-box}
@font-face{font-family:"UrduFont";src:local("Jameel Noori Nastaleeq"),local("JameelNooriNastaleeq"),url("JameelNooriNastaleeq.ttf");size-adjust:171%;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
body{margin:0;font-family:"UrduFont","UrduNoto","Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.6}
.arr{display:none;color:#dc2626;stroke-width:3;animation:blink 1s step-end infinite}.arr.on{display:inline}@keyframes blink{50%{opacity:0}}
input,select,textarea,button{font-family:inherit}
td{unicode-bidi:plaintext}
.upd{display:none;background:#fff7ed;border:1px solid #fdba74;color:#7c2d12;padding:10px 14px;border-radius:10px;margin-bottom:12px;align-items:center;gap:12px;flex-wrap:wrap}.upd.on{display:flex}
header{background:linear-gradient(135deg,var(--navy),#1d4e7a);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px #0003}
header h1{margin:0;font-size:22px;letter-spacing:.3px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
main{max-width:1500px;margin:18px auto;padding:0 16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);padding:12px;border-radius:10px;border:1px solid var(--line)}
.bar select,.bar input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
.bar input{flex:1;min-width:180px}
.btn{border:0;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;background:var(--teal);display:inline-flex;gap:6px;align-items:center}
.btn:hover{filter:brightness(1.1)}.btn.gray{background:#64748b}
.tabs{display:flex;gap:4px;margin-top:16px;border-bottom:2px solid var(--line)}
.tab{padding:10px 22px;cursor:pointer;font-weight:600;color:var(--mut);border:0;background:none;border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--teal);border-color:var(--teal)}
.panel{display:none;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:14px}
.panel.on{display:block}
.wrap{overflow-x:auto;direction:rtl}
table{border-collapse:collapse;width:100%;min-width:1250px}
th{background:var(--navy);color:#fff;text-align:right;padding:10px 8px;font-size:13px;white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:right}
tr:nth-child(even) td{background:#f7f9fc}tr:hover td{background:#e6f4f1}
.act{white-space:nowrap}
.act button{border:0;background:none;cursor:pointer;padding:4px;border-radius:6px}
.act button:hover{background:#0001}
.pv{color:var(--green)}.dl{color:var(--red)}.ed{color:var(--blk)}
.badge{padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
.pending{background:#fef3c7;color:#92400e}.decided{background:#dcfce7;color:#166534}
.pg{display:flex;gap:6px;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap}
.pg div{display:flex;gap:4px;flex-wrap:wrap}
.pg button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 11px;cursor:pointer}
.pg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}.pg button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;color:var(--mut);padding:40px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
.modal.on{display:flex}
.box{background:#fff;border-radius:12px;width:100%;max-width:900px;padding:44px 20px 20px;position:relative}
.xb{position:absolute;top:10px;right:12px;border:0;background:none;cursor:pointer;color:var(--mut);padding:4px;border-radius:6px;display:flex}
.xb:hover{background:#0001;color:var(--red)}
.box h2{margin:0 0 14px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grid label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13px}
.grid input,.grid select,.grid textarea{padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;font-weight:400}
.grid .full{grid-column:1/-1}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.about{max-width:640px;line-height:1.7}
.about .st{padding:10px 14px;border-radius:8px;background:#f1f5f9;margin:10px 0}
.about .ok{background:#dcfce7;color:#166534}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;display:none;z-index:99}
@media(max-width:600px){header h1{font-size:17px}.tab{padding:9px 12px}}
</style>
</head>
<body>
<svg style="display:none">
<symbol id="x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
<symbol id="edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
<symbol id="file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6M9 15l3 3 3-3M12 18v-6"/></symbol>
<symbol id="down" viewBox="0 0 24 24"><path d="M12 4v16M5 13l7 7 7-7"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></symbol>
</svg>

<header>
  <svg class="i" style="width:30px;height:30px"><use href="#file"/></svg>
  <h1>Application Management System</h1>
</header>

<main>
  <div class="bar">
    <select id="sCol"></select>
    <input id="sTxt" placeholder="Search...">
    <button class="btn" id="addBtn"><svg class="i"><use href="#plus"/></svg> Add</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-t="apps">Applications</button>
    <button class="tab" data-t="about"><svg class="i"><use href="#info"/></svg> About <svg class="i arr" id="arr"><use href="#down"/></svg></button>
  </div>

  <div class="panel on" id="apps">
    <div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="pg"><span id="info"></span><div id="pages"></div></div>
  </div>

  <div class="panel" id="about">
    <div class="about">
      <h3>Excel File Connection</h3>
      <div class="st" id="status">No Excel file connected.</div>
      <button class="btn" id="connBtn"><svg class="i"><use href="#file"/></svg> Select Excel File</button>
      <button class="btn gray" id="reBtn" style="display:none">Reconnect last file</button>
      <div class="st" id="verInfo"></div>
      <button class="btn" id="chkBtn"><svg class="i"><use href="#search"/></svg> Check for updates</button>
      <button class="btn" id="updBtn" style="display:none;background:var(--green)">Update now</button>
      <h3>Developer</h3>
      <p><b>Majid Ali</b><br>0300-5005159</p>
    </div>
  </div>
</main>

<div class="modal" id="modal"><div class="box">
  <button class="xb" id="xBtn" title="Close"><svg class="i" style="width:24px;height:24px"><use href="#x"/></svg></button>
  <div class="grid" id="form"></div>
  <div class="foot"><button class="btn gray" id="cancel">Cancel</button><button class="btn" id="save">Save</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const APP_VERSION='1.0.4';
/* Online Urdu fallback: Noto Nastaliq Urdu (used only if Jameel Noori Nastaleeq is not available) */
const NOTO_SIZE='125%';
const NOTO_CSS='https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap';
(function(){
  if(!navigator.onLine)return;
  fetch(NOTO_CSS).then(r=>r.text()).then(css=>{
    /* keep only the Urdu/Arabic-range block so English text is never affected */
    css=css.split('}').filter(b=>/U\+0600/i.test(b)).map(b=>b.replace(/font-family:\s*'Noto Nastaliq Urdu'\s*;/,"font-family:'UrduNoto';size-adjust:"+NOTO_SIZE+";")+'}').join('\n');
    const s=document.createElement('style');s.id='notoStyle';s.textContent=css;document.head.appendChild(s);
  }).catch(()=>{});
})();
const COLS=['Sr. No.','Diary No. CPO','Date (CPO)','Diary No. DC','Date (DC)','Applicant Name','Applicant ID Card','Applicant Contact','Address','Application Against','Tehsil','Police Station','Circle','Division','Return Date','Status'];
const DATES=[2,4,14], DD={10:'tehsil',11:'police station',12:'circle',13:'division'}, PER=15;
let wb=null, handle=null, rows=[], res={}, filtered=[], page=1, editIdx=-1;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon=n=>`<svg class="i"><use href="#${n}"/></svg>`;
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}

/* ---------- IndexedDB (remember file) ---------- */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('ams',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>ok(r.result);r.onerror=no});
async function idbSet(v,k='f'){try{const d=await idb();d.transaction('h','readwrite').objectStore('h').put(v,k)}catch(e){}}
async function idbGet(k='f'){try{const d=await idb();return await new Promise(ok=>{const q=d.transaction('h').objectStore('h').get(k);q.onsuccess=()=>ok(q.result)})}catch(e){return null}}

/* ---------- Excel ---------- */
const d2s=d=>{d=new Date(d.getTime()+43200000);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()};
async function loadFile(){
  const f=await handle.getFile();
  wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
  if(!wb.Sheets['Applications']){wb.SheetNames.push('Applications');wb.Sheets['Applications']=XLSX.utils.aoa_to_sheet([COLS])}
  if(!wb.Sheets['Resources']){wb.SheetNames.push('Resources');wb.Sheets['Resources']=XLSX.utils.aoa_to_sheet([['Field','Value'],['Tehsil','Faisalabad City'],['Police Station','Kotwali'],['Circle','Circle 1'],['Division','Division 1']])}
  const a=XLSX.utils.sheet_to_json(wb.Sheets['Applications'],{header:1,defval:'',raw:true}).slice(1);
  rows=a.filter(r=>r.some(c=>c!=='')).map(r=>COLS.map((_,i)=>{const v=r[i];return v instanceof Date?d2s(v):String(v??'')}));
  res={};let cur='';
  XLSX.utils.sheet_to_json(wb.Sheets['Resources'],{header:1,defval:''}).forEach((r,i)=>{
    if(String(r[0]).trim())cur=String(r[0]).trim().toLowerCase();
    const v=String(r[1]).trim();
    if(v&&cur&&!(i===0&&cur==='field'))(res[cur]=res[cur]||[]).push(v);
  });
  $('status').className='st ok';$('status').textContent='Connected: '+handle.name+' ('+rows.length+' applications)';
  $('reBtn').style.display='none';
  applyFilter();
}
async function saveFile(){
  if(!handle){toast('Please connect an Excel file in the About tab');return false}
  try{
    rows.forEach((r,i)=>r[0]=String(i+1));
    const ws=XLSX.utils.aoa_to_sheet([COLS,...rows]);
    ws['!cols']=COLS.map((_,i)=>({wch:[7,14,12,14,12,24,18,16,32,28,16,18,14,14,12,10][i]}));
    wb.Sheets['Applications']=ws;
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const w=await handle.createWritable();await w.write(out);await w.close();
    return true;
  }catch(e){alert('Could not save. Close the file in Excel and try again.\n'+e.message);return false}
}
async function connect(h){
  handle=h;
  if(await h.requestPermission({mode:'readwrite'})!=='granted'){toast('Permission denied');return}
  await idbSet(h);await loadFile();toast('Excel file connected');
}
$('connBtn').onclick=async()=>{
  if(!window.showOpenFilePicker){alert('This browser does not support file access.');return}
  try{const [h]=await showOpenFilePicker({types:[{description:'Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]});await connect(h)}catch(e){}
};
$('reBtn').onclick=async()=>{const h=await idbGet();if(h)try{await connect(h)}catch(e){alert(e.message)}};

/* ---------- Table ---------- */
function buildHead(){
  $('thead').innerHTML='<tr>'+COLS.map((c,i)=>(i===0||i>=5)?`<th>${c}</th>`:'').join('')+'<th>Actions</th></tr>';
  $('sCol').innerHTML=COLS.map((c,i)=>i>=5?`<option value="${i}">${c}</option>`:'').join('');
  $('sCol').value='6';$('sTxt').dir='auto';
}
function applyFilter(){
  const c=+$('sCol').value,q=$('sTxt').value.trim().toLowerCase();
  filtered=rows.map((r,i)=>({r,i})).filter(o=>!q||o.r[c].toLowerCase().includes(q));
  page=1;render();
}
function render(){
  const n=filtered.length,tp=Math.max(1,Math.ceil(n/PER));if(page>tp)page=tp;
  const s=(page-1)*PER,list=filtered.slice(s,s+PER);
  $('tbody').innerHTML=list.length?list.map((o,k)=>{
    const r=o.r;
    return `<tr><td>${s+k+1}</td>`+r.map((v,i)=>i<5?'':`<td>${i===15?`<span class="badge ${v.toLowerCase()}">${esc(v)}</span>`:esc(v)}</td>`).join('')+
    `<td class="act"><button class="pv" title="Preview" onclick="preview(${o.i})">${icon('eye')}</button><button class="dl" title="Delete" onclick="del(${o.i})">${icon('trash')}</button><button class="ed" title="Edit" onclick="openForm(${o.i})">${icon('edit')}</button></td></tr>`}).join('')
    :`<tr><td colspan="13" class="empty">${handle?'No applications found.':'Connect an Excel file from the About tab to begin.'}</td></tr>`;
  $('info').textContent=n?`Showing ${s+1}-${Math.min(s+PER,n)} of ${n}`:'';
  let b=`<button ${page===1?'disabled':''} onclick="go(${page-1})">Prev</button>`;
  const a=Math.max(1,page-2),z=Math.min(tp,page+2);
  for(let p=a;p<=z;p++)b+=`<button class="${p===page?'on':''}" onclick="go(${p})">${p}</button>`;
  b+=`<button ${page===tp?'disabled':''} onclick="go(${page+1})">Next</button>`;
  $('pages').innerHTML=b;
}
const go=p=>{page=p;render()};
$('sCol').onchange=applyFilter;$('sTxt').oninput=applyFilter;

/* ---------- Form ---------- */
const iso=s=>{const m=/^(\d\d)\/(\d\d)\/(\d{4})$/.exec(s);return m?`${m[3]}-${m[2]}-${m[1]}`:''};
const dmy=s=>s?s.split('-').reverse().join('/'):'';
function openForm(i){
  editIdx=i;const r=i>=0?rows[i]:COLS.map(()=>'');
  let h='';
  for(let k=1;k<16;k++){
    const id='f'+k,v=r[k],cls=(k===8||k===9)?'full':'';
    let inp;
    if(DATES.includes(k))inp=`<input type="date" id="${id}" value="${iso(v)}">`;
    else if(DD[k]){const o=res[DD[k]]||[];inp=`<select id="${id}"><option value="">-- Select --</option>${o.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}${v&&!o.includes(v)?`<option selected>${esc(v)}</option>`:''}</select>`}
    else if(k===15)inp=`<select id="${id}">${['Pending','Decided'].map(x=>`<option ${x.toLowerCase()===v.toLowerCase()?'selected':''}>${x}</option>`).join('')}</select>`;
    else if(k===8)inp=`<textarea id="${id}" rows="2">${esc(v)}</textarea>`;
    else inp=`<input id="${id}" value="${esc(v)}" ${k===6?'placeholder="00000-0000000-0" maxlength="15"':k===7?'placeholder="0000-0000000" maxlength="12"':''}>`;
    h+=`<label class="${cls}">${COLS[k]}${inp}</label>`;
  }
  $('form').innerHTML=h;
  $('form').querySelectorAll('input,textarea').forEach(e=>e.dir='auto');
  $('f6').oninput=e=>{let d=e.target.value.replace(/\D/g,'').slice(0,13);e.target.value=d.length>12?d.slice(0,5)+'-'+d.slice(5,12)+'-'+d.slice(12):d.length>5?d.slice(0,5)+'-'+d.slice(5):d};
  $('f7').oninput=e=>{let d=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=d.length>4?d.slice(0,4)+'-'+d.slice(4):d};
  $('modal').classList.add('on');
}
$('addBtn').onclick=()=>{if(!handle){toast('Connect an Excel file first (About tab)');return}openForm(-1)};
$('cancel').onclick=$('xBtn').onclick=()=>$('modal').classList.remove('on');
$('save').onclick=async()=>{
  if(!$('f5').value.trim()){alert('Applicant Name is required');return}
  const r=[String(rows.length+1)];
  for(let k=1;k<16;k++){const v=$('f'+k).value.trim();r.push(DATES.includes(k)?dmy(v):v)}
  const old=editIdx>=0?rows[editIdx]:null;
  if(editIdx>=0)rows[editIdx]=r;else rows.push(r);
  if(await saveFile()){$('modal').classList.remove('on');toast('Saved to Excel');applyFilter()}
  else{if(old)rows[editIdx]=old;else rows.pop()}
};
async function del(i){
  if(!confirm('Delete this application?'))return;
  const r=rows.splice(i,1)[0];
  if(await saveFile()){toast('Deleted');applyFilter()}else rows.splice(i,0,r);
}

/* ---------- Print preview ---------- */
function preview(i){
  const r=rows[i],w=window.open('','_blank');
  w.document.write(`<html><head><title>Application Management System</title><style>
  @font-face{font-family:UrduFont;src:local('Jameel Noori Nastaleeq'),url('${new URL('JameelNooriNastaleeq.ttf',location.href)}');size-adjust:126%;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
  ${document.getElementById('notoStyle')?.textContent||''}
  body{font-family:UrduFont,UrduNoto,Segoe UI,Arial,sans-serif;padding:30px;color:#111;font-size:19px}h1{text-align:center;margin:0 0 24px;font-size:30px}
  table{width:100%;border-collapse:collapse}td{border:1px solid #333;padding:10px;font-size:19px}td:first-child{width:35%;background:#eee;font-weight:700}
  .sig{display:flex;justify-content:space-between;margin-top:70px}.sig div{border-top:1px solid #000;padding-top:4px;width:200px;text-align:center}
  @media print{button{display:none}}</style></head><body>
  <h1>Application Management System</h1>
  <table>${COLS.slice(1).map((c,k)=>`<tr><td>${c}</td><td>${esc(r[k+1])}</td></tr>`).join('')}</table>
  <div class="sig"><div>Prepared By</div><div>Signature</div></div>
  <script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);
  w.document.close();
}

/* ---------- Auto update ---------- */
const UPDATE_URL='https://raw.githubusercontent.com/salarr/sahir4470/main/version.json';
let newer=null;
const isNewer=(a,b)=>{a=a.split('.').map(Number);b=b.split('.').map(Number);for(let i=0;i<3;i++){const x=a[i]||0,y=b[i]||0;if(x!==y)return x>y}return false};
async function checkUpdate(manual){
  if(UPDATE_URL.includes('YOUR-')){if(manual)toast('Update address is not set');return}
  if(!navigator.onLine){if(manual)toast('No internet connection');return}
  try{
    const j=await(await fetch(UPDATE_URL+'?t='+Date.now(),{cache:'no-store'})).json();
    if(isNewer(j.version,APP_VERSION)){newer=j;$('verInfo').textContent='Version '+APP_VERSION+' - new version '+j.version+' is available.';$('updBtn').style.display='inline-flex';$('arr').classList.add('on');if(manual)toast('A new version is available')}
    else if(manual)toast('You are using the latest version');
  }catch(e){if(manual)toast('Could not check for updates')}
}
async function applyUpdate(){
  if(!newer)return;
  if(!window.showOpenFilePicker){window.open(newer.url);return}
  try{
    let h=await idbGet('app');
    if(!h||await h.requestPermission({mode:'readwrite'})!=='granted'){
      [h]=await showOpenFilePicker({types:[{description:'Application file',accept:{'text/html':['.html']}}]});
      const me=decodeURIComponent(location.pathname.split('/').pop());
      if(h.name!==me)throw new Error('Select this application file: '+me);
      if(await h.requestPermission({mode:'readwrite'})!=='granted')throw new Error('Permission denied');
    }
    const html=await(await fetch(newer.url+'?t='+Date.now(),{cache:'no-store'})).text();
    if(!/^\s*<!DOCTYPE html/i.test(html)||!html.includes("APP_VERSION='"+newer.version+"'"))throw new Error('Downloaded update is not valid');
    const w=await h.createWritable();await w.write(html);await w.close();
    await idbSet(h,'app');
    toast('Updated to '+newer.version+'. Reloading...');
    setTimeout(()=>location.reload(),1500);
  }catch(e){if(e.name!=='AbortError')alert('Update failed: '+e.message)}
}
$('chkBtn').onclick=()=>checkUpdate(true);
$('updBtn').onclick=applyUpdate;
window.addEventListener('online',()=>checkUpdate(false));
setInterval(()=>checkUpdate(false),1800000);

/* ---------- Tabs & init ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');$(t.dataset.t).classList.add('on');
});
window.addEventListener('load',async()=>{
  buildHead();render();
  $('verInfo').textContent='Version '+APP_VERSION;checkUpdate(false);
  const h=await idbGet();
  if(h){handle=null;
    try{if(await h.queryPermission({mode:'readwrite'})==='granted'){handle=h;await loadFile();return}}catch(e){}
    $('status').textContent='Last file: '+h.name+' - click Reconnect';$('reBtn').style.display='inline-flex';
  }
});
</script>
</body>
</html>
